<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factura - Yaku Sabor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../CSS/styledash.css">
</head>

<body>
    <div class="container py-4">
        <div class="d-flex align-items-start justify-content-between flex-wrap gap-3 mb-3">
            <div>
                <h1 class="m-0 fw-bold" style="color:#1b3a57; line-height:1.05;">Yaku</h1>
                <div class="fw-semibold" style="color:#1b3a57;">Sabor Restaurante</div>
            </div>

            <div class="text-end">
                <div class="badge text-bg-warning-subtle text-warning border border-warning-subtle px-3 py-2 mb-2">
                    Boleta / Factura
                </div>
                <div class="row g-2 justify-content-end">
                    <div class="col-12 col-md-7">
                        <label class="form-label mb-1">Numero de comprobante</label>
                        <input type="text" class="form-control" placeholder="002-5152">
                    </div>
                    <div class="col-12 col-md-5">
                        <label class="form-label mb-1">Fecha</label>
                        <input type="date" class="form-control">
                    </div>
                </div>
            </div>
        </div>

        <section class="card-panel p-3 p-md-4">
            <div class="row g-3">
                <div class="col-12 col-lg-4">
                    <label class="form-label">Telefono</label>
                    <input type="text" class="form-control" placeholder="(placeholder)">
                </div>
                <div class="col-12 col-lg-4">
                    <label class="form-label">RUC</label>
                    <input type="text" class="form-control" placeholder="(placeholder)">
                </div>
                <div class="col-12 col-lg-4">
                    <label class="form-label">Ruc o sedula de identidad</label>
                    <input type="text" class="form-control" placeholder="si no se tiene datos poner xx">
                </div>
            </div>

            <div class="row g-3 mt-1">
                <div class="col-12">
                    <label class="form-label">Nombre o razon social</label>
                    <input type="text" class="form-control" placeholder="En caso no se tenga nombre poner sin nombre">
                </div>
            </div>

            <div class="mt-4">
                <div class="d-flex align-items-center justify-content-between flex-wrap gap-2 mb-2">
                    <h2 class="h5 mb-0" style="color:#1b3a57;">Detalle de productos</h2>
                    <button class="btn btn-warning btn-sm" type="button" aria-label="Agregar detalle">
                        <span class="fw-bold">+</span>
                    </button>
                </div>

                <div class="table-responsive">
                    <table class="table table-striped table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Cantidad</th>
                                <th scope="col">Descripcion</th>
                                <th scope="col">Precio unitario</th>
                                <th scope="col">Tasa IVA %</th>
                                <th scope="col">Valor de venta</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- agregar conexion con backend aqui: completar lineas de detalle con productos reales -->
                            <tr>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                                <td></td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="mt-4">
                <div class="row g-3">
                    <div class="col-12 col-md-4">
                        <label class="form-label">Habilitacion N</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Original (Cliente)</label>
                        <input type="text" class="form-control" placeholder="Cliente">
                    </div>
                    <div class="col-12 col-md-4">
                        <label class="form-label">Copia (Archivo tributario)</label>
                        <input type="text" class="form-control" placeholder="Archivo tributario">
                    </div>
                </div>

                <div class="row g-3 mt-1">
                    <div class="col-12 col-md-6">
                        <label class="form-label">Ubicacion</label>
                        <input type="text" class="form-control">
                    </div>
                </div>
            </div>
        </section>

        <div class="d-flex justify-content-end gap-2 mt-3">
            <!-- agregar conexion con este componente aqui: guardar factura e invocar servicio de impresión -->
            <button class="btn btn-outline-warning" type="button">Borrar</button>
            <button class="btn btn-danger" type="button">Imprimir</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

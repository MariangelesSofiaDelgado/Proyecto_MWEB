
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Mesa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../CSS/styledash.css">
  <style>
    .mesa-owner-strip {
      font-size:.82rem; border-radius:10px; padding:8px 14px; margin-bottom:14px;
      display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    }
    .owner-mio    { background:#dcfce7; color:#15803d; border:1px solid #86efac; }
    .owner-libre  { background:#e8f1fb; color:#1b3a57; border:1px solid #c9daef; }
    .owner-otro   { background:#fef3c7; color:#92400e; border:1px solid #fcd34d; }
    .btn-atender-mesa {
      background:#1b3a57; color:#fff; border:none; border-radius:8px;
      font-size:.78rem; font-weight:700; padding:5px 14px; cursor:pointer;
    }
    .historial-card { border-radius:12px; border:1px solid #e2e8f0; margin-bottom:16px; }
    .historial-header {
      padding:10px 14px; font-weight:700; font-size:.85rem; color:#1b3a57;
      display:flex; justify-content:space-between; align-items:center; cursor:pointer;
    }
    .historial-body { padding:0 14px 12px; font-size:.82rem; }
    .historial-pedido {
      border-top:1px solid #f1f5f9; padding:8px 0; display:flex; flex-direction:column; gap:2px;
    }
    .historial-pedido .fila { display:flex; justify-content:space-between; color:#475569; }
    .historial-estado {
      font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:999px; text-transform:capitalize;
    }
  </style>
</head>

<body>
  <div class="container my-4">
    <div class="mesa-detail-hero mb-4">
      <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
        <div>
          <h2 id="mesa-title" class="mb-1">Cargando…</h2>
          <p class="mb-0 text-muted" style="font-size:.85rem">
            Selecciona productos por categoría y envía el pedido a cocina.
          </p>
        </div>
        <a href="Gestion DeSala.html" class="btn btn-light fw-semibold">← Volver a Sala</a>
      </div>
    </div>

    <!-- Estado de asignación de la mesa -->
    <div id="ownerStrip" class="mesa-owner-strip owner-libre" style="display:none;"></div>

    <!-- Historial de pedidos de esta mesa -->
    <div class="card historial-card">
      <div class="historial-header" id="historialToggle">
        <span>🧾 Pedidos de esta mesa <span id="historialCount" class="text-muted" style="font-weight:500;"></span></span>
        <span id="historialCaret">▾</span>
      </div>
      <div class="historial-body" id="historialBody" style="display:none;">
        <div id="historialContenido" class="text-muted">Cargando historial…</div>
      </div>
    </div>

    <div class="row g-4 align-items-start">
      <!-- Ticket -->
      <div class="col-12 col-lg-4">
        <div class="card ticket-card h-100">
          <div class="card-header ticket-header d-flex justify-content-between align-items-center">
            <span>🧾 Ticket</span>
            <button id="clear-ticket" type="button" class="btn btn-sm btn-outline-light">Limpiar</button>
          </div>
          <div class="card-body ticket-body">
            <div class="ticket-meta mb-3">
              <div><strong>Mesa:</strong> <span id="ticket-mesa">—</span></div>
              <div><strong>Items:</strong> <span id="ticket-count">0</span></div>
            </div>
            <div id="ticket-empty" class="ticket-empty">No hay productos agregados.</div>
            <div id="ticket-items" class="ticket-items"></div>
          </div>
          <div class="card-footer ticket-footer">
            <div class="d-flex justify-content-between align-items-center mb-2">
              <span>Total</span>
              <strong id="ticket-total">S/ 0.00</strong>
            </div>

            <!-- BOTÓN ENVIAR A COCINA -->
            <button class="btn-send-kitchen" id="btnEnviarCocina" disabled>
              Enviar a Cocina
            </button>

            <!-- Feedback inline -->
            <div id="kitchen-feedback" class="mt-2"
              style="display:none; font-size:.82rem; border-radius:8px; padding:8px 12px;"></div>
          </div>
        </div>
      </div>

      <!-- Categorías + Productos -->
      <div class="col-12 col-lg-8">
        <div class="card category">
          <div class="card-header category-bar" id="categoryBar">
            <span id="productosCargando">
              <span class="spinner-border spinner-border-sm me-1" role="status"></span>
              Cargando menú…
            </span>
          </div>
          <div class="card-body category-body" id="categoryBody">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    // ── Config ─────────────────────────────────────────────────
    function resolveApiBaseUrl() {
      const override = window.__API_BASE_URL__ || localStorage.getItem("apiBaseUrl");
      if (override) {
        return override.replace(/\/$/, "");
      }

      const { origin, hostname, protocol } = window.location;

      if (hostname.endsWith(".app.github.dev") || hostname.endsWith(".githubpreview.dev")) {
        return origin.replace(/-(\d+)\.app\.github\.dev$/, "-8080.app.github.dev").replace(/-(\d+)\.githubpreview\.dev$/, "-8080.githubpreview.dev") + "/api";
      }

      return `${protocol}//${hostname}:8080/api`;
    }

    const API_BASE = resolveApiBaseUrl();
    const API_PRODUCTOS = `${API_BASE}/productos`;
    const API_PEDIDOS = `${API_BASE}/pedidos`;
    const API_MESAS = `${API_BASE}/mesas`;

    // ── Sesión actual ───────────────────────────────────────────
    const rolActual = (sessionStorage.getItem("rol") || "").trim().toLowerCase();
    const userId = parseInt(sessionStorage.getItem("userId") || "0", 10) || null;
    const esAdmin = rolActual.includes("admin");
    const esMesero = rolActual.includes("mesero");

    // ── Parámetros de URL ──────────────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const mesaCod = params.get("mesa") || "—";
    const mesaId = parseInt(params.get("mesaId") || "0", 10); // opcional, por si se pasa

    document.getElementById("mesa-title").textContent = `MESA ${mesaCod}`;
    document.getElementById("ticket-mesa").textContent = mesaCod;

    // ── Auth headers ───────────────────────────────────────────
    function authHeaders() {
      const token = sessionStorage.getItem("token");
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    // ── Normalización de categorías ────────────────────────────
    function normalizarCategoria(nombre) {
      const n = (nombre || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
      if (n.includes("piqueo") || n.includes("entrada")) return "Piqueos y Entradas";
      if (n.includes("sandwich")) return "Sándwiches";
      if (n.includes("fondo") || n.includes("plato")) return "Platos de Fondo";
      if (n.includes("postre")) return "Postres";
      if (n.includes("bebida")) return "Bebidas";
      return nombre || "Otros";
    }

    // ── Ticket ─────────────────────────────────────────────────
    const ticketState = new Map(); // id → { nombre, precio, cantidad }
    const fmt = v => `S/ ${Number(v).toFixed(2)}`;

    function renderTicket() {
      const itemsEl = document.getElementById("ticket-items");
      const emptyEl = document.getElementById("ticket-empty");
      const countEl = document.getElementById("ticket-count");
      const totalEl = document.getElementById("ticket-total");
      const sendBtn = document.getElementById("btnEnviarCocina");

      itemsEl.innerHTML = "";

      if (!ticketState.size) {
        emptyEl.style.display = "block";
        countEl.textContent = "0";
        totalEl.textContent = "S/ 0.00";
        sendBtn.disabled = true;
        return;
      }

      emptyEl.style.display = "none";
      let total = 0, count = 0;

      ticketState.forEach(item => {
        total += item.precio * item.cantidad;
        count += item.cantidad;

        const row = document.createElement("div");
        row.className = "ticket-item";
        row.innerHTML = `
          <div>
            <div class="ticket-item-name">${item.nombre}</div>
            <div class="ticket-item-meta">${fmt(item.precio)} × ${item.cantidad}</div>
          </div>
          <strong>${fmt(item.precio * item.cantidad)}</strong>`;
        itemsEl.appendChild(row);
      });

      countEl.textContent = String(count);
      totalEl.textContent = fmt(total);
      // El botón solo se habilita si el usuario tiene permiso sobre la mesa (ver puedeOperar()).
      sendBtn.disabled = !puedeOperar();
    }

    // ── Feedback inline ────────────────────────────────────────
    function showFeedback(msg, tipo = "success") {
      const el = document.getElementById("kitchen-feedback");
      el.textContent = msg;
      el.style.display = "block";
      el.style.background = tipo === "success" ? "#d1fae5" : "#fee2e2";
      el.style.color = tipo === "success" ? "#065f46" : "#991b1b";
      el.style.border = `1px solid ${tipo === "success" ? "#6ee7b7" : "#fca5a5"}`;
    }

    function hideFeedback() {
      document.getElementById("kitchen-feedback").style.display = "none";
    }

    // ── Estado de asignación de la mesa (mozo responsable) ─────
    let mesaInfo = null; // { id, codigo, estado, meseroId, meseroNombre, ... }

    function puedeOperar() {
      // El admin siempre puede. Un cliente/rol desconocido no debería llegar aquí,
      // pero por seguridad la validación real y definitiva ocurre en el backend.
      if (esAdmin) return true;
      if (!esMesero) return false;
      if (!mesaInfo) return true; // aún no resolvimos la info; el backend validará igual
      return !mesaInfo.meseroId || mesaInfo.meseroId === userId;
    }

    function renderOwnerStrip() {
      const strip = document.getElementById("ownerStrip");
      if (!mesaInfo) { strip.style.display = "none"; return; }

      strip.style.display = "flex";
      strip.classList.remove("owner-mio", "owner-libre", "owner-otro");

      if (!mesaInfo.meseroId) {
        strip.classList.add("owner-libre");
        strip.innerHTML = esMesero
          ? `🪑 Esta mesa no tiene mozo asignado. <button class="btn-atender-mesa" id="btnAtenderAqui">Atender esta mesa</button>`
          : `🪑 Esta mesa no tiene mozo asignado todavía.`;
      } else if (esMesero && mesaInfo.meseroId === userId) {
        strip.classList.add("owner-mio");
        strip.innerHTML = `✔ Tú estás atendiendo esta mesa.`;
      } else {
        strip.classList.add("owner-otro");
        strip.innerHTML = `👤 Esta mesa está siendo atendida por <strong>${mesaInfo.meseroNombre || "otro mozo"}</strong>. Puedes ver sus pedidos, pero no puedes agregar productos ni cobrar.`;
      }

      const btnAtender = document.getElementById("btnAtenderAqui");
      if (btnAtender) {
        btnAtender.addEventListener("click", atenderMesaDesdeAqui);
      }
    }

    async function atenderMesaDesdeAqui() {
      try {
        const idMesa = await resolveMesaId();
        const res = await fetch(`${API_MESAS}/${idMesa}/asignar`, {
          method: "PUT",
          headers: authHeaders(),
          body: JSON.stringify({ meseroId: userId })
        });
        if (!res.ok) throw new Error(await res.text());
        mesaInfo = await res.json();
        renderOwnerStrip();
        renderTicket();
        showFeedback("✅ Ahora tú atiendes esta mesa.", "success");
      } catch (err) {
        showFeedback(`❌ ${err.message}`, "danger");
      }
    }

    async function cargarInfoMesa() {
      try {
        const idMesa = await resolveMesaId();
        if (!idMesa) return;
        const res = await fetch(`${API_MESAS}/estado`, { headers: authHeaders() });
        if (!res.ok) return;
        const todas = await res.json();
        mesaInfo = todas.find(m => m.id === idMesa) || null;
      } catch { /* silencioso */ }
      renderOwnerStrip();
      renderTicket();
    }

    // ── Historial de pedidos de la mesa ─────────────────────────
    document.getElementById("historialToggle").addEventListener("click", () => {
      const body = document.getElementById("historialBody");
      const caret = document.getElementById("historialCaret");
      const abierto = body.style.display !== "none";
      body.style.display = abierto ? "none" : "block";
      caret.textContent = abierto ? "▾" : "▴";
    });

    function badgeEstadoPedido(estado) {
      const colores = {
        nuevo: ["#fef9c3", "#a16207"], en_preparacion: ["#fef3c7", "#b45309"],
        listo: ["#dbeafe", "#1d4ed8"], entregado: ["#dcfce7", "#15803d"],
        facturado: ["#e2e8f0", "#475569"], cancelado: ["#fee2e2", "#dc2626"]
      };
      const [bg, fg] = colores[estado] || ["#f1f5f9", "#64748b"];
      return `<span class="historial-estado" style="background:${bg};color:${fg}">${(estado||"").replace("_"," ")}</span>`;
    }

    async function cargarHistorialPedidos() {
      const cont = document.getElementById("historialContenido");
      try {
        const idMesa = await resolveMesaId();
        if (!idMesa) { cont.textContent = "No se pudo identificar la mesa."; return; }

        const res = await fetch(`${API_MESAS}/${idMesa}/pedidos`, { headers: authHeaders() });
        if (!res.ok) throw new Error(await res.text());
        const pedidos = await res.json();

        document.getElementById("historialCount").textContent = pedidos.length ? `(${pedidos.length})` : "";

        if (!pedidos.length) {
          cont.innerHTML = `<div class="text-muted">Aún no se han registrado pedidos en esta mesa.</div>`;
          return;
        }

        cont.innerHTML = pedidos.map(p => {
          const items = (p.detalles || []).map(d => `${d.cantidad}× ${d.nombreProducto || d.productoNombre || ""}`).join(", ");
          const fecha = p.createdAt ? new Date(p.createdAt).toLocaleString("es-PE") : "";
          return `
            <div class="historial-pedido">
              <div class="fila">
                <span><strong>Pedido #${p.id}</strong> — ${p.meseroNombre || "Sin mozo"}</span>
                ${badgeEstadoPedido(p.estado)}
              </div>
              <div class="fila">
                <span>${items || "Sin detalle"}</span>
                <strong>${fmt(p.total || 0)}</strong>
              </div>
              <div class="text-muted" style="font-size:.72rem;">${fecha}</div>
            </div>`;
        }).join("");
      } catch (err) {
        cont.innerHTML = `<div class="text-danger">⚠️ No se pudo cargar el historial: ${err.message}</div>`;
      }
    }

    // ── Buscar mesaId real por código si no viene en la URL ───
    let resolvedMesaId = mesaId || null;

    async function resolveMesaId() {
      if (resolvedMesaId) return resolvedMesaId;
      try {
        const res = await fetch(`${API_MESAS}/estado`, { headers: authHeaders() });
        if (!res.ok) return null;
        const mesas = await res.json();
        const found = mesas.find(m => m.codigo === mesaCod);
        if (found) resolvedMesaId = found.id;
      } catch { 
        
       }
      return resolvedMesaId;
    }

    // ── Enviar pedido a cocina ─────────────────────────────────
    document.getElementById("btnEnviarCocina").addEventListener("click", async () => {
      if (!ticketState.size) return;
      if (!puedeOperar()) {
        showFeedback("❌ No puedes enviar pedidos: esta mesa está asignada a otro mozo.", "danger");
        return;
      }

      const btn = document.getElementById("btnEnviarCocina");
      btn.disabled = true;
      btn.textContent = "⏳ Enviando…";
      hideFeedback();

      try {
        const idMesa = await resolveMesaId();
        if (!idMesa) throw new Error("No se pudo identificar la mesa. Verifica que el backend esté encendido.");

        const items = Array.from(ticketState.values()).map(item => ({
          productoId: item.id,
          cantidad: item.cantidad,
          precioUnitario: item.precio
        }));

        const total = Array.from(ticketState.values())
          .reduce((s, i) => s + i.precio * i.cantidad, 0);

        const payload = {
          tipoPedido: "presencial",
          mesaId: idMesa,
          items,
          total
        };

        const res = await fetch(API_PEDIDOS, {
          method: "POST",
          headers: authHeaders(),
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const txt = await res.text();
          throw new Error(txt || `Error ${res.status}`);
        }

        const data = await res.json();
        showFeedback(`✅ Pedido #${data.id} enviado a cocina. La mesa queda marcada como Ocupada.`, "success");

        // Limpiar ticket
        ticketState.clear();
        renderTicket();

        // Refrescar info de la mesa (por si el envío auto-asignó al mozo) e historial
        await cargarInfoMesa();
        await cargarHistorialPedidos();

      } catch (err) {
        showFeedback(`❌ ${err.message}`, "danger");
      } finally {
        btn.disabled = false || !puedeOperar();
        btn.innerHTML = "🍳 Enviar a Cocina";
      }
    });

    // ── Render menú desde API ──────────────────────────────────
    async function cargarProductos() {
      const categoryBar = document.getElementById("categoryBar");
      const categoryBody = document.getElementById("categoryBody");

      try {
        const res = await fetch(API_PRODUCTOS, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Error ${res.status}`);
        const productos = await res.json();

        // Agrupar por categoría normalizada (solo disponibles)
        const grupos = {};
        productos.filter(p => p.disponible).forEach(p => {
          const cat = normalizarCategoria(p.categoria?.nombre);
          if (!grupos[cat]) grupos[cat] = [];
          grupos[cat].push(p);
        });

        const cats = Object.keys(grupos).sort();

        if (!cats.length) {
          categoryBar.innerHTML = `<span style="color:#64748b;font-size:.88rem">No hay productos disponibles.</span>`;
          categoryBody.innerHTML = "";
          return;
        }

        // Tabs
        categoryBar.innerHTML = cats.map((cat, i) => `
          <button type="button" class="btn category-tab${i === 0 ? " active" : ""}" data-target="${i}">
            ${cat}
          </button>`).join("");

        // Paneles
        categoryBody.innerHTML = cats.map((cat, i) => {
          const items = grupos[cat];
          const btns = items.map(p => `
            <button type="button" class="btn product-btn"
              data-id="${p.id}" data-name="${p.nombre.replace(/"/g, '&quot;')}" data-price="${p.precio}">
              ${p.nombre}
              <span>${fmt(p.precio)}</span>
            </button>`).join("");

          return `
            <div class="category-panel${i === 0 ? " active" : ""}" data-panel="${i}">
              <div class="product-grid">${btns}</div>
            </div>`;
        }).join("");

        // Eventos tabs
        categoryBar.querySelectorAll(".category-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            categoryBar.querySelectorAll(".category-tab").forEach(t => t.classList.remove("active"));
            categoryBody.querySelectorAll(".category-panel").forEach(p => p.classList.remove("active"));
            tab.classList.add("active");
            categoryBody.querySelector(`[data-panel="${tab.dataset.target}"]`)?.classList.add("active");
          });
        });

        // Eventos botones de producto — con contador +/−
        categoryBody.querySelectorAll(".product-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.id);
            const nombre = btn.dataset.name;
            const precio = parseFloat(btn.dataset.price);

            if (ticketState.has(id)) {
              ticketState.get(id).cantidad += 1;
            } else {
              ticketState.set(id, { id, nombre, precio, cantidad: 1 });
            }
            renderTicket();
          });
        });

      } catch (err) {
        categoryBar.innerHTML = `<span style="color:#dc2626;font-size:.85rem">Error al cargar productos: ${err.message}</span>`;
        categoryBody.innerHTML = "";
      }
    }

    // ── Limpiar ticket ─────────────────────────────────────────
    document.getElementById("clear-ticket").addEventListener("click", () => {
      ticketState.clear();
      renderTicket();
      hideFeedback();
    });

    // ── Init ───────────────────────────────────────────────────
    renderTicket();
    cargarProductos();
    cargarInfoMesa();
    cargarHistorialPedidos();

  </script>
</body>

</html>

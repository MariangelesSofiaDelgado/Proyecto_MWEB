<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de Mesa</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../CSS/styledash.css">
</head>

<body>
  <div class="container my-4">
    <div class="mesa-detail-hero mb-4">
      <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap">
        <div>
          <span class="badge bg-light text-dark mb-2">Mesa activa</span>
          <h2 id="mesa-title" class="mb-2">Cargando…</h2>
          <p class="mb-0">Selecciona productos por categoría para esta mesa.</p>
        </div>
        <a href="Gestion DeSala.html" class="btn btn-light fw-semibold">Volver</a>
      </div>
    </div>

    <div class="row g-4 align-items-start">
      <!-- Ticket -->
      <div class="col-12 col-lg-4">
        <div class="card ticket-card h-100">
          <div class="card-header ticket-header d-flex justify-content-between align-items-center">
            <span>Ticket</span>
            <button id="clear-ticket" type="button" class="btn btn-sm btn-outline-light">Limpiar</button>
          </div>
          <div class="card-body ticket-body">
            <div class="ticket-meta mb-3">
              <div><strong>Mesa:</strong> <span id="ticket-mesa">—</span></div>
              <div><strong>Items:</strong> <span id="ticket-count">0</span></div>
            </div>
            <div id="ticket-empty" class="ticket-empty">No hay productos agregados.</div>
            <div id="ticket-items" class="ticket-items"></div>
          </div>
          <div class="card-footer ticket-footer d-flex justify-content-between align-items-center">
            <span>Total</span>
            <strong id="ticket-total">S/ 0.00</strong>
          </div>
        </div>
      </div>

      <!-- Categorías + Productos -->
      <div class="col-12 col-lg-8">
        <div class="card category">
          <div class="card-header category-bar" id="categoryBar">
            <span id="productosCargando">
              <span class="spinner-border spinner-border-sm me-1" role="status"></span>
              Cargando menú…
            </span>
          </div>
          <div class="card-body category-body" id="categoryBody">
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
  <script>
    // ── Parámetros de URL ──────────────────────────────
    const params = new URLSearchParams(window.location.search);
    const mesaCod = params.get("mesa") || "—";
    document.getElementById("mesa-title").textContent = `MESA ${mesaCod}`;
    document.getElementById("ticket-mesa").textContent = mesaCod;

    // ── API ────────────────────────────────────────────
    const API_PRODUCTOS = "http://localhost:8080/api/productos";

    function authHeaders() {
      const token = localStorage.getItem("token");
      return {
        "Content-Type": "application/json",
        ...(token ? { Authorization: `Bearer ${token}` } : {})
      };
    }

    // ── Normalización de categorías ────────────────────
    function normalizarCategoria(nombre) {
      const n = (nombre || "").normalize("NFD").replace(/[\u0300-\u036f]/g, "").trim().toLowerCase();
      if (n.includes("piqueo") || n.includes("entrada")) return "Piqueos y Entradas";
      if (n.includes("sandwich")) return "Sándwiches";
      if (n.includes("fondo") || n.includes("plato")) return "Platos de Fondo";
      if (n.includes("postre")) return "Postres";
      if (n.includes("bebida")) return "Bebidas";
      return nombre || "Otros";
    }

    // ── Ticket ─────────────────────────────────────────
    const ticketState = new Map(); // id → { nombre, precio, cantidad }

    const fmt = v => `S/ ${Number(v).toFixed(2)}`;

    function renderTicket() {
      const itemsEl = document.getElementById("ticket-items");
      const emptyEl = document.getElementById("ticket-empty");
      const countEl = document.getElementById("ticket-count");
      const totalEl = document.getElementById("ticket-total");

      itemsEl.innerHTML = "";

      if (!ticketState.size) {
        emptyEl.style.display = "block";
        countEl.textContent = "0";
        totalEl.textContent = "S/ 0.00";
        return;
      }

      emptyEl.style.display = "none";
      let total = 0, count = 0;

      ticketState.forEach(item => {
        total += item.precio * item.cantidad;
        count += item.cantidad;

        const row = document.createElement("div");
        row.className = "ticket-item";
        row.innerHTML = `
          <div>
            <div class="ticket-item-name">${item.nombre}</div>
            <div class="ticket-item-meta">${fmt(item.precio)} × ${item.cantidad}</div>
          </div>
          <strong>${fmt(item.precio * item.cantidad)}</strong>`;
        itemsEl.appendChild(row);
      });

      countEl.textContent = String(count);
      totalEl.textContent = fmt(total);
    }

    // ── Render menú desde API ──────────────────────────
    async function cargarProductos() {
      const categoryBar = document.getElementById("categoryBar");
      const categoryBody = document.getElementById("categoryBody");

      try {
        const res = await fetch(API_PRODUCTOS, { headers: authHeaders() });
        if (!res.ok) throw new Error(`Error ${res.status}`);
        const productos = await res.json();

        // Agrupar por categoría normalizada
        const grupos = {};
        productos.forEach(p => {
          const cat = normalizarCategoria(p.categoria?.nombre);
          if (!grupos[cat]) grupos[cat] = [];
          grupos[cat].push(p);
        });

        const cats = Object.keys(grupos).sort();

        if (!cats.length) {
          categoryBar.innerHTML = `<span style="color:#64748b;font-size:.88rem">No hay productos registrados.</span>`;
          categoryBody.innerHTML = "";
          return;
        }

        // Tabs
        categoryBar.innerHTML = cats.map((cat, i) => `
          <button type="button" class="btn category-tab${i === 0 ? " active" : ""}" data-target="${i}">
            ${cat}
          </button>`).join("");

        // Paneles
        categoryBody.innerHTML = cats.map((cat, i) => {
          const items = grupos[cat];
          const btns = items.map(p => {
            const disponible = Boolean(p.disponible);
            if (disponible) {
              return `
                <button type="button" class="btn product-btn"
                  data-id="${p.id}" data-name="${p.nombre.replace(/"/g, '&quot;')}" data-price="${p.precio}">
                  ${p.nombre}
                  <span>${fmt(p.precio)}</span>
                </button>`;
            } else {
              return `
                <button type="button" class="btn product-btn no-disponible" disabled>
                  ${p.nombre}
                  <span>${fmt(p.precio)}</span>
                  <span class="badge-nodisponible">No disponible</span>
                </button>`;
            }
          }).join("");

          return `
            <div class="category-panel${i === 0 ? " active" : ""}" data-panel="${i}">
              <div class="product-grid">${btns}</div>
            </div>`;
        }).join("");

        // Eventos tabs
        categoryBar.querySelectorAll(".category-tab").forEach(tab => {
          tab.addEventListener("click", () => {
            categoryBar.querySelectorAll(".category-tab").forEach(t => t.classList.remove("active"));
            categoryBody.querySelectorAll(".category-panel").forEach(p => p.classList.remove("active"));
            tab.classList.add("active");
            categoryBody.querySelector(`[data-panel="${tab.dataset.target}"]`)?.classList.add("active");
          });
        });

        // Eventos botones de producto (solo los disponibles)
        categoryBody.querySelectorAll(".product-btn:not(.no-disponible)").forEach(btn => {
          btn.addEventListener("click", () => {
            const id = parseInt(btn.dataset.id);
            const nombre = btn.dataset.name;
            const precio = parseFloat(btn.dataset.price);

            if (ticketState.has(id)) {
              ticketState.get(id).cantidad += 1;
            } else {
              ticketState.set(id, { nombre, precio, cantidad: 1 });
            }
            renderTicket();
          });
        });

      } catch (err) {
        categoryBar.innerHTML = `<span style="color:#dc2626;font-size:.85rem">Error al cargar productos: ${err.message}</span>`;
        categoryBody.innerHTML = "";
      }
    }

    // ── Limpiar ticket ─────────────────────────────────
    document.getElementById("clear-ticket").addEventListener("click", () => {
      ticketState.clear();
      renderTicket();
    });

    // ── Init ───────────────────────────────────────────
    renderTicket();
    cargarProductos();
  </script>
</body>

</html>

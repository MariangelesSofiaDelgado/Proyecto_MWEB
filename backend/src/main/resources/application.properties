spring.application.name=backend

# ===============================
# CONFIGURACIÓN DE BASE DE DATOS
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/yaku_sabores?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=admin123

# Hibernate / JPA
# "update" crea o actualiza las tablas automáticamente basándose en tus clases Java, 
# "none" asume que tú ya creaste las tablas con el script SQL que me pasaste. 
# Como ya tienes el script SQL, usaremos "none" o "validate"
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CONFIGURACIÓN DEL SERVIDOR
# ===============================
server.port=8080

# ===============================
# JWT SECRET (Para más adelante)
# ===============================
jwt.secret=UnaClaveSuperSecretaParaYakuSaborQueDebeSerLarga123456789!
jwt.expiration=86400000